# On demand: backtest every tournament strategy on 5 years of real daily prices; save and email the report.
name: Backtest all strategies

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: orderflow-edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Backtest
        run: python tournament.py --start 2026-11-01 --backtest | grep -v 'days,' | tee backtest_all.txt
      - name: Email the report
        if: always()
        continue-on-error: true
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python notify.py --report backtest_all.txt "Backtest - all strategies, 5 years"
      - name: Save
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "paper-trading-bot@users.noreply.github.com"
          git add backtest_all.txt
          git diff --cached --quiet || git commit -m "Backtest of all strategies $(date -u +%Y-%m-%d)"
          git pull --rebase -q && git push
